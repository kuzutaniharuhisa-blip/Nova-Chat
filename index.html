<!doctype html>
<html lang="ja">
<head>

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaChat</title>
<style>
:root{color-scheme:dark;--bg:#111218;--panel:#191b24;--panel2:#222531;--line:#303341;--text:#f1f2f8;--muted:#a1a5b5;--accent:#7c83ff;--input:#222530;--hover:#292c39}
:root[data-theme=light]{color-scheme:light;--bg:#f4f5fb;--panel:#fff;--panel2:#eceefa;--line:#dfe1ec;--text:#25283a;--muted:#6d7286;--accent:#6268e8;--input:#f6f7fc;--hover:#e8eaf7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif;height:100vh}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:var(--accent);color:white;font-weight:650}button:hover{filter:brightness(1.08)}button:disabled{opacity:.5}.secondary,.iconbtn,.tinybtn{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.hidden{display:none!important}.field{background:var(--input);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:12px;outline:none}.field:focus{border-color:var(--accent)}
#setupNotice{margin:24px auto;max-width:720px;padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:16px}#app{height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.brand{padding:22px 18px 16px;font-size:21px;font-weight:850}.brand span{color:var(--accent)}.me{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;margin-top:auto}.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:800;flex-shrink:0;overflow:hidden;color:white}.avatar img{width:100%;height:100%;object-fit:cover}.muted{color:var(--muted);font-size:12px}.side-section{padding:12px 10px 4px}.side-label{padding:6px 9px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:1px}.navbtn,.userrow{display:flex;width:100%;align-items:center;gap:10px;text-align:left;background:transparent;color:var(--muted);padding:10px;border-radius:8px}.navbtn.active,.navbtn:hover,.userrow:hover,.userrow.active{background:var(--hover);color:var(--text)}.userlist{overflow:auto;min-height:0;padding:0 10px}.userrow .usertext{min-width:0;flex:1}.userrow strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.main{display:flex;flex-direction:column;min-width:0;min-height:0}.topbar{min-height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:10px}.topbar h1{font-size:17px;margin:0}.topbar .sub{color:var(--muted);font-size:12px;margin-left:auto}.messages{flex:1;overflow:auto;padding:22px max(18px,calc((100% - 900px)/2));display:flex;flex-direction:column;gap:10px}.empty{margin:auto;text-align:center;color:var(--muted);max-width:400px}.msg{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:10px}.msg:hover{background:var(--hover)}.msgbody{min-width:0;flex:1}.msghead{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}.msghead strong{font-size:14px}.time{font-size:11px;color:var(--muted)}.msgtext{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:3px}.msgtools,.reactionbar{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}.tinybtn{font-size:11px;padding:4px 8px}.composer{padding:14px 18px 18px;border-top:1px solid var(--line)}.compose-inner{max-width:900px;margin:auto;display:flex;gap:8px}.compose-inner input{flex:1;min-width:0}.compose-inner button{min-width:58px}.hint{max-width:900px;margin:7px auto 0;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:10px}.notice{margin:12px 18px 0;padding:10px 12px;border-radius:9px;background:var(--panel2);font-size:12px;border:1px solid var(--line)}.error{color:#ff9aa7}.authwrap{min-height:100vh;display:grid;place-items:center;padding:20px}.authcard{width:min(430px,100%);padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 70px #0003}.authcard h1{margin:0 0 5px;font-size:28px}.authcard p{color:var(--muted);margin:0 0 20px}.authcard label{display:block;margin:13px 0 6px;color:var(--muted);font-size:13px}.authcard input{width:100%}.authrow{display:flex;gap:8px}.authrow button{flex:1}.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:14px 0}.or:before,.or:after{content:"";height:1px;background:var(--line);flex:1}.authstatus{min-height:20px;margin-top:12px;font-size:13px}.searchbar{padding:10px 18px;border-bottom:1px solid var(--line)}.searchbar input{width:100%;max-width:900px;display:block;margin:auto}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 15px;border-radius:10px;z-index:5;box-shadow:0 8px 30px #0003}
@media(max-width:720px){#app{grid-template-columns:68px minmax(0,1fr)}.brand{font-size:0;padding:20px 12px}.brand:after{content:"N";font-size:24px;color:var(--accent)}.brand span,.side-label,.navbtn .navtext,.me .who,.userlist{display:none}.side-section{padding:10px 8px}.navbtn{justify-content:center;font-size:0}.navbtn .ico{font-size:18px}.me{padding:10px 4px;justify-content:center;flex-wrap:wrap}.me .avatar{width:32px;height:32px}.me button{padding:6px}.topbar{padding:0 10px;min-height:58px}.topbar .sub{display:none}.topbar h1{font-size:14px;flex:1}.messages{padding:10px 6px}.msg{gap:7px;padding:5px 2px}.msg .avatar{width:30px;height:30px}.composer{padding:10px}.compose-inner button{min-width:45px;padding:9px}.hint{font-size:10px}.searchbar{padding:8px}}
</style></head><body>
<div id="setupNotice" class="hidden"><h2>NovaChat の設定が必要です</h2><p><code>config.js</code> に Supabase の Project URL と anon key を設定してください。service_role key は絶対に公開しないでください。</p></div>
<section id="authScreen" class="authwrap"><div class="authcard"><div class="brand" style="padding:0 0 12px">Nova<span>Chat</span></div><h1>会話をはじめよう。</h1><p>公開チャットでも、1対1でも。</p><label for="email">メールアドレス</label><input class="field" id="email" type="email" autocomplete="email" placeholder="you@example.com"><label for="password">パスワード</label><input class="field" id="password" type="password" autocomplete="current-password" placeholder="6文字以上"><div class="authrow"><button id="signInBtn">ログイン</button><button id="signUpBtn" class="secondary">新規登録</button></div><div class="or">または</div><button id="googleBtn" class="secondary" style="width:100%">Googleで続ける</button><div id="authStatus" class="authstatus" role="status"></div><p class="muted" style="margin-top:14px">個人情報やパスワードをチャットに投稿しないでください。</p></div></section>
<div id="app" class="hidden"><aside><div class="brand">Nova<span>Chat</span></div><div class="side-section"><div class="side-label">チャット</div><button id="publicNav" class="navbtn active"><span class="ico">#</span><span class="navtext">公開チャット</span></button><div class="side-label" style="margin-top:12px">ユーザー</div></div><div id="userList" class="userlist"></div><div class="me"><div id="myAvatar" class="avatar">?</div><div class="who" style="min-width:0;flex:1"><strong id="myName">ユーザー</strong><div class="muted">ログイン中</div></div><button id="themeBtn" class="iconbtn" title="テーマ切替">☼</button><button id="signOutBtn" class="secondary" title="ログアウト">↪</button></div></aside><main class="main"><header class="topbar"><h1 id="roomTitle"># 公開チャット</h1><div class="sub" id="roomSubtitle">誰でも参加できる会話</div><button id="searchToggle" class="iconbtn" title="検索">⌕</button><button id="scrollBottom" class="iconbtn" title="最新へ">↓</button></header><div id="searchbar" class="searchbar hidden"><input id="searchInput" class="field" type="search" placeholder="表示中のメッセージを検索…"></div><div id="banner" class="notice hidden" role="status"></div><div id="messages" class="messages" aria-live="polite"><div class="empty">メッセージを読み込んでいます…</div></div><form id="composer" class="composer"><div class="compose-inner"><input id="messageInput" class="field" maxlength="2000" autocomplete="off" placeholder="# 公開チャットにメッセージを送信" aria-label="メッセージ"><button id="emojiBtn" class="iconbtn" type="button" title="絵文字を挿入">☺</button><button id="sendBtn" type="submit">送信</button></div><div class="hint"><span>Enterで送信 · Shift+Enterで改行</span><span id="charCount">0 / 2000</span></div></form></main></div><div id="toast" class="toast hidden" role="status"></div>
<script src="./config.js"></script><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const cfg=window.NOVACHAT_CONFIG||{};const $=s=>document.querySelector(s);const authScreen=$('#authScreen'),app=$('#app'),authStatus=$('#authStatus'),banner=$('#banner'),messagesEl=$('#messages'),userListEl=$('#userList');let supabase,currentUser=null,currentMode='public',activeDm=null,channel=null,userRefreshTimer=null,userCache={};
function status(t,e=false){authStatus.textContent=t;authStatus.className='authstatus'+(e?' error':'')}function notify(t){banner.textContent=t;banner.classList.remove('hidden');setTimeout(()=>banner.classList.add('hidden'),5000)}function toast(t){const el=$('#toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),2200)}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function initial(s='?'){return [...s.trim()][0]?.toUpperCase()||'?'}function avatar(p){const n=p?.display_name||p?.email||'?';return `<div class="avatar">${p?.avatar_url?`<img src="${esc(p.avatar_url)}" alt="">`:esc(initial(n))}</div>`}function time(v){try{return new Date(v).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}catch{return ''}}function empty(t){messagesEl.innerHTML=`<div class="empty">${esc(t)}</div>`}
function msgHtml(m){const p=m.profiles||{};return `<article class="msg" data-msg-id="${esc(m.id)}">${avatar(p)}<div class="msgbody"><div class="msghead"><strong>${esc(p.display_name||p.email||'ユーザー')}</strong><span class="time">${time(m.created_at)}</span></div><div class="msgtext">${esc(m.body)}</div><div class="msgtools"><button class="tinybtn copyMsg" type="button">コピー</button><button class="tinybtn reactMsg" type="button">👍 リアクション</button></div><div class="reactionbar hidden"><button class="tinybtn" type="button">👍</button><button class="tinybtn" type="button">❤️</button><button class="tinybtn" type="button">😂</button><button class="tinybtn" type="button">🎉</button><button class="tinybtn" type="button">🔥</button></div></div></article>`}function render(rows){if(!rows?.length){empty('まだメッセージがありません。最初のメッセージを送ってみよう！');return}messagesEl.innerHTML=rows.map(msgHtml).join('');searchFilter();messagesEl.scrollTop=messagesEl.scrollHeight}async function fetchProfiles(ids){if(!ids?.length)return{};const{data,error}=await supabase.from('profiles').select('id,display_name,email,avatar_url').in('id',[...new Set(ids)]);if(error)throw error;return Object.fromEntries((data||[]).map(p=>[p.id,p]))}
async function loadPublic(){currentMode='public';activeDm=null;$('#roomTitle').textContent='# 公開チャット';$('#roomSubtitle').textContent='誰でも参加できる会話';$('#messageInput').placeholder='# 公開チャットにメッセージを送信';$('#publicNav').classList.add('active');document.querySelectorAll('.userrow').forEach(x=>x.classList.remove('active'));empty('メッセージを読み込んでいます…');await refreshChannel('public');const{data,error}=await supabase.from('public_messages').select('id,user_id,body,created_at').order('created_at',{ascending:true}).limit(150);if(error){empty('公開チャットを読み込めませんでした。SQL設定とRLSを確認してください。');notify(error.message);return}try{const ps=await fetchProfiles(data.map(x=>x.user_id));render(data.map(x=>({...x,profiles:ps[x.user_id]})))}catch(e){notify(e.message)}}
async function loadDm(other){if(!other||other===currentUser.id)return;try{let{data:found,error:fe}=await supabase.from('conversations').select('id,user1,user2').or(`and(user1.eq.${currentUser.id},user2.eq.${other}),and(user1.eq.${other},user2.eq.${currentUser.id})`).maybeSingle();if(fe)throw fe;if(!found){const{data:n,error}=await supabase.from('conversations').insert({user1:currentUser.id,user2:other}).select('id,user1,user2').single();if(error){if(error.code==='23505'){const r=await supabase.from('conversations').select('id,user1,user2').or(`and(user1.eq.${currentUser.id},user2.eq.${other}),and(user1.eq.${other},user2.eq.${currentUser.id})`).single();if(r.error)throw r.error;found=r.data}else throw error}else found=n}activeDm={id:found.id,other};currentMode='dm';$('#roomTitle').textContent='↔ '+(userCache[other]?.display_name||userCache[other]?.email||'個別チャット');$('#roomSubtitle').textContent='あなたと相手だけに表示されます';$('#messageInput').placeholder='個別メッセージを送信';$('#publicNav').classList.remove('active');document.querySelectorAll('.userrow').forEach(x=>x.classList.toggle('active',x.dataset.id===other));empty('メッセージを読み込んでいます…');await refreshChannel('dm:'+found.id);const{data,error}=await supabase.from('direct_messages').select('id,conversation_id,user_id,body,created_at').eq('conversation_id',found.id).order('created_at',{ascending:true}).limit(150);if(error)throw error;const ps=await fetchProfiles(data.map(x=>x.user_id));render(data.map(x=>({...x,profiles:ps[x.user_id]})))}catch(e){notify('個別チャットを開けません: '+e.message);empty('個別チャットを開けませんでした。SQL設定とRLSを確認してください。')}}
async function refreshUsers(){try{const{data,error}=await supabase.from('profiles').select('id,display_name,email,avatar_url').neq('id',currentUser.id).order('display_name').limit(100);if(error)throw error;userCache=Object.fromEntries((data||[]).map(p=>[p.id,p]));userListEl.innerHTML=(data||[]).map(p=>`<button class="userrow ${activeDm?.other===p.id?'active':''}" data-id="${esc(p.id)}">${avatar(p)}<span class="usertext"><strong>${esc(p.display_name||p.email||'ユーザー')}</strong><span class="muted">個別チャット</span></span></button>`).join('')||'<div class="muted" style="padding:12px">まだ他のユーザーがいません。</div>';userListEl.querySelectorAll('.userrow').forEach(b=>b.addEventListener('click',()=>loadDm(b.dataset.id)))}catch(e){notify('ユーザー一覧を取得できません: '+e.message)}}
async function refreshChannel(key){if(channel){await supabase.removeChannel(channel);channel=null}if(key==='public'){channel=supabase.channel('public-message-feed').on('postgres_changes',{event:'INSERT',schema:'public',table:'public_messages'},async payload=>{if(currentMode!=='public'||messagesEl.querySelector(`[data-msg-id="${CSS.escape(String(payload.new.id))}"]`))return;try{const ps=await fetchProfiles([payload.new.user_id]);append({...payload.new,profiles:ps[payload.new.user_id]})}catch(e){console.error(e)}}).subscribe()}else{const id=key.slice(3);channel=supabase.channel('dm-feed-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'direct_messages',filter:`conversation_id=eq.${id}`},async payload=>{if(currentMode!=='dm'||activeDm?.id!==id||messagesEl.querySelector(`[data-msg-id="${CSS.escape(String(payload.new.id))}"]`))return;try{const ps=await fetchProfiles([payload.new.user_id]);append({...payload.new,profiles:ps[payload.new.user_id]})}catch(e){console.error(e)}}).subscribe()}}
function append(m){if(messagesEl.querySelector(`[data-msg-id="${CSS.escape(String(m.id))}"]`))return;if(messagesEl.querySelector('.empty'))messagesEl.innerHTML='';messagesEl.insertAdjacentHTML('beforeend',msgHtml(m));searchFilter();messagesEl.scrollTop=messagesEl.scrollHeight;if(m.user_id!==currentUser.id)toast('新しいメッセージ')}
async function send(body){if(!body.trim())return;const b=body.trim();const{error}=currentMode==='public'?await supabase.from('public_messages').insert({user_id:currentUser.id,body:b}):await supabase.from('direct_messages').insert({conversation_id:activeDm.id,user_id:currentUser.id,body:b});if(error)throw error}
async function enter(user){currentUser=user;authScreen.classList.add('hidden');app.classList.remove('hidden');const dn=user.user_metadata?.full_name||user.user_metadata?.name||user.email?.split('@')[0]||'ユーザー',av=user.user_metadata?.avatar_url||user.user_metadata?.picture||null;const{error:pe}=await supabase.from('profiles').upsert({id:user.id,email:user.email,display_name:dn,avatar_url:av,updated_at:new Date().toISOString()},{onConflict:'id'});if(pe)notify('プロフィール保存エラー: '+pe.message);const{data:me}=await supabase.from('profiles').select('id,display_name,email,avatar_url').eq('id',user.id).maybeSingle();$('#myName').textContent=me?.display_name||dn;$('#myAvatar').innerHTML=me?.avatar_url?`<img src="${esc(me.avatar_url)}" alt="">`:esc(initial($('#myName').textContent));await refreshUsers();await loadPublic();if(userRefreshTimer)clearInterval(userRefreshTimer);userRefreshTimer=setInterval(refreshUsers,30000)}
$('#signInBtn').addEventListener('click',async()=>{const email=$('#email').value.trim(),password=$('#password').value;if(!email||!password)return status('メールアドレスとパスワードを入力してください。',true);status('ログイン中…');const{error}=await supabase.auth.signInWithPassword({email,password});if(error)status(error.message,true)});$('#signUpBtn').addEventListener('click',async()=>{const email=$('#email').value.trim(),password=$('#password').value;if(!email||!password)return status('メールアドレスとパスワードを入力してください。',true);if(password.length<6)return status('パスワードは6文字以上にしてください。',true);status('登録中…');const{data,error}=await supabase.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});if(error)status(error.message,true);else if(!data.session)status('確認メールを送信しました。メール内のリンクを開いてからログインしてください。')});$('#googleBtn').addEventListener('click',async()=>{status('Googleログインへ移動します…');const{error}=await supabase.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});if(error)status(error.message,true)});$('#signOutBtn').addEventListener('click',async()=>{await supabase.auth.signOut();if(channel)await supabase.removeChannel(channel);if(userRefreshTimer)clearInterval(userRefreshTimer);currentUser=null;app.classList.add('hidden');authScreen.classList.remove('hidden');status('ログアウトしました。')});$('#publicNav').addEventListener('click',loadPublic);$('#composer').addEventListener('submit',async e=>{e.preventDefault();const i=$('#messageInput');if(!i.value.trim())return;$('#sendBtn').disabled=true;try{await send(i.value);i.value='';$('#charCount').textContent='0 / 2000'}catch(err){notify('送信できませんでした: '+err.message)}finally{$('#sendBtn').disabled=false;i.focus()}});$('#messageInput').addEventListener('input',e=>$('#charCount').textContent=`${e.target.value.length} / 2000`);$('#messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#composer').requestSubmit()}});
$('#themeBtn').addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=n;try{localStorage.setItem('novachat-theme',n)}catch{}$('#themeBtn').textContent=n==='light'?'☾':'☼'});$('#searchToggle').addEventListener('click',()=>{$('#searchbar').classList.toggle('hidden');if(!$('#searchbar').classList.contains('hidden'))$('#searchInput').focus();else{$('#searchInput').value='';searchFilter()}});function searchFilter(){const q=$('#searchInput').value.trim().toLocaleLowerCase();messagesEl.querySelectorAll('.msg').forEach(el=>el.classList.toggle('hidden',!!q&&!el.innerText.toLocaleLowerCase().includes(q)))}$('#searchInput').addEventListener('input',searchFilter);$('#scrollBottom').addEventListener('click',()=>messagesEl.scrollTo({top:messagesEl.scrollHeight,behavior:'smooth'}));$('#emojiBtn').addEventListener('click',()=>{const i=$('#messageInput'),s=i.selectionStart,e=i.selectionEnd;i.setRangeText(' 😀',s,e,'end');i.focus();i.dispatchEvent(new Event('input'))});messagesEl.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const a=b.closest('.msg');if(!a)return;if(b.classList.contains('copyMsg')){try{await navigator.clipboard.writeText(a.querySelector('.msgtext').textContent);toast('コピーしました')}catch{toast('コピーできませんでした')}}else if(b.classList.contains('reactMsg'))a.querySelector('.reactionbar').classList.toggle('hidden');else if(b.closest('.reactionbar')){const emoji=b.textContent,key=a.dataset.msgId;let data={};try{data=JSON.parse(localStorage.getItem('novachat-reactions')||'{}')}catch{}data[key]=data[key]===emoji?'':emoji;try{localStorage.setItem('novachat-reactions',JSON.stringify(data))}catch{}let chip=a.querySelector('.reaction-chip');if(data[key]){if(!chip){chip=document.createElement('span');chip.className='time reaction-chip';a.querySelector('.msgtools').append(chip)}chip.textContent=data[key]+' あなた'}else if(chip)chip.remove();a.querySelector('.reactionbar').classList.add('hidden')}});
async function start(){try{const t=localStorage.getItem('novachat-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;$('#themeBtn').textContent=document.documentElement.dataset.theme==='light'?'☾':'☼'}catch{}if(!cfg.url||!cfg.anonKey||cfg.url.includes('YOUR_')||cfg.anonKey.includes('YOUR_')){authScreen.classList.add('hidden');$('#setupNotice').classList.remove('hidden');return}supabase=createClient(cfg.url,cfg.anonKey);const{data:{session}}=await supabase.auth.getSession();if(session?.user)await enter(session.user);supabase.auth.onAuthStateChange((event,session)=>{if(session?.user&&!currentUser)setTimeout(()=>enter(session.user),0);else if(!session?.user&&currentUser){currentUser=null;app.classList.add('hidden');authScreen.classList.remove('hidden')}})}start().catch(e=>status('起動エラー: '+e.message,true));
</script></body></html>
